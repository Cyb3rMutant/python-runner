services:
  timetable:
    build: .
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - .:/app
      - ${SSH_DEPLOY_KEY_PATH:-./deploy_key}:/root/.ssh/id_ed25519:ro
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME:-d}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-dev@yzd.uk}
