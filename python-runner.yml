services:
  python-runner:
    build: .
    restart: unless-stopped
    ports:
      - 8088:8080
    volumes:
      - .:/app
    environment:
      - PHAROS_USERNAME=${PHAROS_USERNAME}
      - PHAROS_PASSWORD=${PHAROS_PASSWORD}
      - POLR_USERNAME=${POLR_USERNAME}
      - POLR_PASSWORD=${POLR_PASSWORD}
      - POLR_API_KEY=${POLR_API_KEY}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - /data/ollama/models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen3:0.6b"]
    volumes:
      - /data/ollama/models:/root/.ollama
